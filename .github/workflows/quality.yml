name: Quality

on: [push, pull_request]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - name: Bootstrap drift check
        run: |
          bash scripts/sync-bootstrap.sh
          git diff --exit-code

      - name: Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Export LCOV coverage
        run: |
          set -euo pipefail
          # SwiftPM's build dir and test-bundle names differ per toolchain
          # (.build/debug/JSRCoreTests.xctest locally, a single
          # .build/<triple>/debug/<Package>PackageTests.xctest on CI Xcode) —
          # discover every test executable and export per binary.
          PROFDATA=$(find .build -path "*codecov/default.profdata" | head -1)
          test -n "$PROFDATA"
          xcrun llvm-profdata merge -sparse "$PROFDATA" -o Coverage.profdata
          rm -f coverage.lcov /tmp/raw-*.lcov
          COUNT=0
          for BIN in $(find .build -type f -path "*/Contents/MacOS/*" | grep "\.xctest/" | grep -v "\.dSYM/" | sort -u); do
            echo "exporting coverage from: $BIN"
            # one export per binary: a combined multi-binary export silently
            # drops the second binary's records
            xcrun llvm-cov export -format=lcov -instr-profile Coverage.profdata \
              "$BIN" > "/tmp/raw-$COUNT.lcov"
            COUNT=$((COUNT+1))
          done
          echo "exported $COUNT binaries"
          test "$COUNT" -gt 0
          cat /tmp/raw-*.lcov \
            | awk 'BEGIN{keep=0} /^SF:/{keep=($0 ~ "^SF:.*/Sources/(JSRCore|JSRAppKit)/")} {if(keep)print}' \
            | awk '/^SF:/{p=$0; if(seen[p]){skip=1; next} seen[p]=1} {if(!skip)print} /^end_of_record/{skip=0}' \
            > coverage.lcov
          if [ ! -s coverage.lcov ]; then
            echo "coverage.lcov missing or empty" >&2
            exit 1
          fi

      - name: Build crap4swift (pinned)
        run: swift build -c release --package-path .conformance/crap4swift

      - name: CRAP gate (threshold 8.0)
        run: .conformance/crap4swift/.build/release/crap4swift Sources/JSRCore Sources/JSRAppKit --coverage coverage.lcov --threshold 8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Demo conformance run (macOS host)
        run: |
          swift build --product JSRAppKitDemo
          rm -rf /tmp/apple-macos
          .build/debug/JSRAppKitDemo --conformance .conformance/js_widget_runtime/docs/conformance/fixtures --out /tmp/apple-macos
          test -s /tmp/apple-macos/hello.result.json
          test -s /tmp/apple-macos/counter.result.json
          test -s /tmp/apple-macos/scroll_list.result.json

      - name: Harness compare
        run: |
          # guard: the pinned harness exits 0 with an empty 0% score when the
          # results dir holds no *.result.json (kit defect, fixed in wave D)
          COUNT=$(ls -1 /tmp/apple-macos/*.result.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 3 ]; then
            echo "expected >= 3 *.result.json in /tmp/apple-macos, found $COUNT" >&2
            exit 1
          fi
          node .conformance/js_widget_runtime/harness/harness.mjs compare \
            --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures \
            --results /tmp/apple-macos \
            --out-report /tmp/apple-macos-report.md
          cat /tmp/apple-macos-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-macos
          path: |
            /tmp/apple-macos/hello.result.json
            /tmp/apple-macos/counter.result.json
            /tmp/apple-macos/scroll_list.result.json
            /tmp/apple-macos-report.md

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS demo project
        run: xcodegen generate --spec Demo/iOS/project.yml

      - name: Pick simulator destination
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | grep -oE "[A-F0-9]{8}-[A-F0-9-]{27}" || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-F0-9]{8}-[A-F0-9-]{27}")
          fi
          echo "picked simulator UDID: $UDID"
          test -n "$UDID"
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"

      - name: xcodebuild test (iOS simulator, coverage)
        run: |
          set -o pipefail
          xcodebuild test -project Demo/iOS/JSRUIDemo.xcodeproj -scheme JSRUIDemo \
            -destination "platform=iOS Simulator,id=$IOS_UDID" -enableCodeCoverage YES \
            -resultBundlePath Coverage.xcresult

      - name: Collect ios conformance results from the app container
        run: |
          mkdir -p /tmp/apple-ios
          # the same UDID xcodebuild tested on; bootstatus boots it when
          # xcodebuild shut it down after testing
          xcrun simctl bootstatus "$IOS_UDID" -b
          CONTAINER=$(xcrun simctl get_app_container "$IOS_UDID" dev.fa1.JSRUIDemo data 2>/dev/null || true)
          echo "app container: $CONTAINER"
          if [ -n "$CONTAINER" ] && [ -d "$CONTAINER/tmp/jsr-ios" ]; then
            cp "$CONTAINER"/tmp/jsr-ios/*.result.json /tmp/apple-ios/
          else
            echo "container tmp listing:" >&2
            ls "$CONTAINER/tmp" 2>&1 || true >&2
            echo "no app container results at \$CONTAINER/tmp/jsr-ios" >&2
            exit 1
          fi
          test -s /tmp/apple-ios/hello.result.json
          test -s /tmp/apple-ios/counter.result.json
          test -s /tmp/apple-ios/scroll_list.result.json

      - name: Export LCOV coverage (iOS)
        run: |
          set -euo pipefail
          xcrun xccov view --report --json Coverage.xcresult > /tmp/xccov-dump.json || true
          swift scripts/xcresult-to-lcov.swift --xcresult Coverage.xcresult --out coverage-ios.lcov || true
          if [ -s coverage-ios.lcov ] && grep -q "^SF:" coverage-ios.lcov; then
            echo "xccov path OK: $(grep -c '^SF:' coverage-ios.lcov) records"
          else
            echo "xccov path yielded no records; llvm-cov fallback"
            # Xcode 16 stores coverage as `profdna` inside .xccovarchive bundles
            PROFDATA_LIST=$(find Coverage.xcresult \( -name "*.profdata" -o -name "profdna" \))
            echo "profdatas: $PROFDATA_LIST"
            test -n "$PROFDATA_LIST"
            # shellcheck disable=SC2086
            xcrun llvm-profdata merge -sparse $PROFDATA_LIST -o Coverage-ios.profdata
            DD=$(dirname "$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -name 'JSRUIDemo-*' | head -1)")/Build/Products/Debug-iphonesimulator
            echo "products: $DD"
            rm -f coverage-ios.lcov /tmp/raw-ios-*.lcov
            i=0
            for BIN in $(find "$DD" \( -name "JSRCore" -o -name "JSRUIKit" -o -name "JSRUIKitTests" \) | grep -E "framework/|xctest/" | sort -u); do
              echo "exporting coverage from: $BIN"
              # one export per binary (a combined multi-binary export drops records)
              xcrun llvm-cov export -format=lcov -instr-profile Coverage-ios.profdata \
                "$BIN" > "/tmp/raw-ios-$i.lcov" 2>/dev/null || true
              i=$((i+1))
            done
            echo "exported $i binaries"
            test "$i" -gt 0
            cat /tmp/raw-ios-*.lcov \
              | awk 'BEGIN{keep=0} /^SF:/{keep=($0 ~ "^SF:.*/Sources/(JSRCore|JSRUIKit)/")} {if(keep)print}' \
              | awk '/^SF:/{p=$0; if(seen[p]){skip=1; next} seen[p]=1} {if(!skip)print} /^end_of_record/{skip=0}' \
              > coverage-ios.lcov
          fi
          test -s coverage-ios.lcov
          grep -q "^SF:" coverage-ios.lcov
          echo "coverage-ios.lcov: $(grep -c '^SF:' coverage-ios.lcov) records"

      - name: Build crap4swift (pinned)
        run: swift build -c release --package-path .conformance/crap4swift

      - name: CRAP gate on the iOS coverage (threshold 8.0)
        run: .conformance/crap4swift/.build/release/crap4swift Sources/JSRCore Sources/JSRUIKit --coverage coverage-ios.lcov --threshold 8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harness compare (ios results)
        run: |
          # guard: the pinned harness exits 0 with an empty 0% score when the
          # results dir holds no *.result.json (kit defect, fixed in wave D)
          COUNT=$(ls -1 /tmp/apple-ios/*.result.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 3 ]; then
            echo "expected >= 3 *.result.json in /tmp/apple-ios, found $COUNT" >&2
            exit 1
          fi
          node .conformance/js_widget_runtime/harness/harness.mjs compare \
            --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures \
            --results /tmp/apple-ios \
            --out-report /tmp/apple-ios-report.md
          cat /tmp/apple-ios-report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-ios
          path: |
            /tmp/apple-ios/
            /tmp/apple-ios-report.md
            /tmp/xccov-dump.json
            coverage-ios.lcov
          if-no-files-found: warn
